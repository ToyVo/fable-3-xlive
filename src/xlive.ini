##############################################
##  Unified xlive.dll
##  place xlive.ini in <exe> directory
##  - or for "global" ini, place in c:\
##
##  Migrating from fakexlive.ini? Just copy your
##  xuidl/xuidh values below as profile xuid 1.
##  (%APPDATA%\Lionhead Studios\Fable 3\fakexlive.ini
##   is also read automatically if this file is absent.)
##########################################

##########################################
##  Account data (up to 4 local profiles).
##  profile xuid N is HEX: paste your save folder's
##  16-digit name verbatim (e.g. 1000100010001000
##  means hi 10001000 / lo 10001000, like Timeslip's
##  xuidh/xuidl). An optional 0x prefix is fine.
profile name 1 = Player1
profile xuid 1 = 1122334400000000

#########################################
##  Fake online LIVE account (local only,
##  never connects to the Internet)
online profile = 1

##########################################
##  Profile save directory
save directory = XLiveEmu

#########################################
##  Troubleshooting (log lands in %TEMP%\xlive_trace.log,
##  kept out of the game dir so SecuROM file scans stay quiet)
debug log = 0

#########################################
##  Message display (Timeslip behavior):
##  0 = ignore, 1 = MessageBox, 2 = log only
##  (no D3DX overlay in this build)
ShowMessages = 2

#########################################
##  Launcher-check patch (TEST ONLY, default off):
##  removes Fable 3's launcher check on the exact
##  1.1.1.3 exe so Fable3.exe runs directly.
##  0 = off. 1 = permanent patch (Timeslip behavior,
##      but SecuROM spots it later: "pirated copy"
##      notice, forced lowest detail, disabled features).
##  2 = self-healing (recommended for direct launch):
##      patch at load, restore the original byte once
##      the game initializes, so later SecuROM scans
##      see pristine bytes and stay quiet.
##  3 = trampoline (experimental): the patch exists
##      only while the check itself executes.
LoaderPatch = 0
